server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost;
    client_max_body_size 1000000;

    location / {
        root ./www;
        index index.html;
        allowed_methods GET;
    }

    location /cgi-bin {
        root ./www;
        allowed_methods GET POST;
        cgi_extension .py /usr/bin/python3;
    }
}