# webserv test configuration
#
# NGINX-style syntax: directives end with ';', blocks use '{ }'.
# Every feature the subject asks for appears at least once below,
# so this file doubles as a checklist for the parser.

# ---------------------------------------------------------------------------
# Server 1 - the main site, and the default for port 8080
# ---------------------------------------------------------------------------
server {
    listen          8080;
    host            127.0.0.1;
    server_name     localhost webserv.local;

    # Default error pages. Any status not listed here gets a built-in page.
    error_page      404 /errors/404.html;
    error_page      500 502 503 /errors/50x.html;

    # Max request body in bytes. A POST larger than this gets 413.
    client_max_body_size 1000000;

    # Route: the site root
    location / {
        root            ./www;
        index           index.html;
        allowed_methods GET;
        autoindex       off;
    }

    # Route: static assets, directory listing on
    location /static {
        root            ./www;
        allowed_methods GET;
        autoindex       on;
    }

    # Route: file upload target
    location /upload {
        root            ./www;
        allowed_methods GET POST DELETE;
        upload_store    ./www/uploads;
        client_max_body_size 5000000;
    }

    # Route: CGI. Any file under here with a matching extension is executed,
    # not served. The path after the extension is PATH_INFO.
    location /cgi-bin {
        root            ./www;
        allowed_methods GET POST;
        cgi_extension   .py  /usr/bin/python3;
        cgi_extension   .php /usr/bin/php-cgi;
    }

    # Route: HTTP redirect. No root needed - nothing is served.
    location /old-page {
        return          301 /;
    }

    # Route: a directory with no index and no autoindex -> 403
    location /private {
        root            ./www;
        allowed_methods GET;
        autoindex       off;
    }
}

# ---------------------------------------------------------------------------
# Server 2 - same port, different server_name (virtual host by name)
# The first server block for a host:port is the default when no name matches.
# ---------------------------------------------------------------------------
server {
    listen          8080;
    host            127.0.0.1;
    server_name     other.local;

    location / {
        root            ./www/other;
        index           index.html;
        allowed_methods GET;
    }
}

# ---------------------------------------------------------------------------
# Server 3 - a second port, minimal
# ---------------------------------------------------------------------------
server {
    listen          8081;
    host            127.0.0.1;

    client_max_body_size 100;

    location / {
        root            ./www;
        index           index.html;
        allowed_methods GET POST;
    }
}
