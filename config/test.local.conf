# webserv config for the 42 tester
# Run: ./webserv config/test.conf   then   ./tester http://localhost:8080

server {
    listen               8080;
    host                 127.0.0.1;
    server_name          localhost;

    # The tester POSTs bodies of 100MB to the .bla CGI, so keep this big
    client_max_body_size 200000000;

    # / -> GET only (.bla files -> POST runs the CGI)
    location / {
        root            ./YoupiBanane;
        allowed_methods GET;
        cgi_extension   .bla ./tester_/cgi_tester;
    }

    # /post_body -> POST only, max body 100 bytes (bigger -> 413)
    location /post_body {
        root                 ./YoupiBanane;
        allowed_methods      POST;
        client_max_body_size 100;
    }

    # /directory/ -> GET, root is YoupiBanane,
    # default file youpi.bad_extension when no file is requested
    location /directory/ {
        root            ./YoupiBanane;
        allowed_methods GET;
        index           youpi.bad_extension;
        cgi_extension   .bla ./tester_/cgi_tester;
    }
}