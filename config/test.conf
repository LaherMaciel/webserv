# Configuration for the official 42 webserv tester.
# Place the downloaded cgi_test executable in the repository root.

server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost;

    # The CGI stress test sends a very large request body.
    client_max_body_size 0;

    # The site root accepts GET only.
    location / {
        root ./www;
        index index.html;
        allowed_methods GET;
    }

    # This route accepts POST bodies up to and including 100 bytes.
    location /post_body {
        root ./www;
        allowed_methods POST;
        client_max_body_size 100;
    }

    # Maps /directory/... to ./YoupiBanane/....
    location /directory {
        root ./YoupiBanane;
        index youpi.bad_extension;
        allowed_methods GET POST;
        cgi_extension .bla ../cgi_tester;
    }
}
